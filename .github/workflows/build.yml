name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Greenshot binaries
        uses: actions/cache@v4
        with:
          path: lib
          key: greenshot-refs-${{ hashFiles('tools/Get-GreenshotRefs.ps1') }}

      - name: Get Greenshot binaries
        shell: pwsh
        run: ./tools/Get-GreenshotRefs.ps1

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup[0].Version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Test (stitching)
        run: dotnet test tests/HUScroll.Tests -c Release

      - name: Build plugin for Greenshot 1.3
        run: dotnet build src/Greenshot.Plugin.HUScroll.V13 -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Build plugin for Greenshot 1.4
        run: dotnet build src/Greenshot.Plugin.HUScroll.V14 -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/HUScroll'
          New-Item -ItemType Directory -Force -Path "$out/Greenshot-1.3", "$out/Greenshot-1.4" | Out-Null
          Copy-Item src/Greenshot.Plugin.HUScroll.V13/bin/Release/net472/Greenshot.Plugin.HUScroll.dll "$out/Greenshot-1.3/"
          Copy-Item src/Greenshot.Plugin.HUScroll.V14/bin/Release/net48/Greenshot.Plugin.HUScroll.dll "$out/Greenshot-1.4/"
          Copy-Item tools/Install-HUScroll.ps1, LIESMICH.txt, LICENSE $out
          Compress-Archive -Path "$out/*" -DestinationPath "dist/HUScroll-${{ steps.version.outputs.version }}.zip" -Force
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: HUScroll-${{ steps.version.outputs.version }}
          path: dist/HUScroll/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/HUScroll-${{ steps.version.outputs.version }}.zip" --title "HUScroll $env:GITHUB_REF_NAME" --generate-notes
